name: Build ValidaFuturo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Prepare web assets & sync Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "www/validafuturo.html" ] && [ ! -f "www/index.html" ]; then
            cp www/validafuturo.html www/index.html
          fi
          ls -la www
          npx cap add android || true
          npx cap sync android

      - name: Set ValidaFuturo icon with navy background
        run: |
          curl -fsSL "https://i.postimg.cc/jjgTMcBp/BCV-20261120-191902-0000.png" -o raw_logo.png
          python3 - << 'PYEOF'
          import shutil
          try:
              from PIL import Image
              bg = Image.new("RGBA", (512, 512), (11, 14, 28, 255))
              fg = Image.open("raw_logo.png").convert("RGBA")
              fg.thumbnail((340, 340), Image.Resampling.LANCZOS)
              x = (512 - fg.width) // 2
              y = (512 - fg.height) // 2
              bg.paste(fg, (x, y), fg)
              bg.convert("RGB").save("logo_validafuturo.png", "PNG")
          except Exception:
              shutil.copyfile("raw_logo.png", "logo_validafuturo.png")
          PYEOF
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp logo_validafuturo.png "$dir/ic_launcher.png"
              cp logo_validafuturo.png "$dir/ic_launcher_round.png"
              cp logo_validafuturo.png "$dir/ic_launcher_foreground.png"
            fi
          done
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml \
                android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml \
                android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
                android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          mkdir -p android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0b0e1c</color>
          </resources>
          EOF
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValidaFuturo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
